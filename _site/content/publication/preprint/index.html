<p>The correlator terms $\langle J(t)J(0) \rangle$ from the Drude weight give an accurate diagnosis of the ballistic transport. However, this is very difficult to calculate in principle. We pursue a more tractable version by minimizing the density of the rate of change of current, $\dot{\hat{J}}$.</p>
